services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sweety
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_local_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sweety", "-d", "sweety"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://sweety:sweety_local_dev@db:5432/sweety
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
